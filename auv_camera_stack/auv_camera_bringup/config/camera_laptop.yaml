camera_receiver:
  ros__parameters:
    listen_port:         5600
    buffer_size:         524288
    frame_id:           "camera"
    publish_compressed:  true

adaptive_controller:
  ros__parameters:
    target_brightness:    100.0
    brightness_deadband:   10.0
    kp:   0.5
    ki:   0.05
    min_exposure:   50
    max_exposure:   800
    whiteout_threshold:   210.0
    whiteout_frames:        3
    whiteout_exposure:     30
    control_hz:   2.0
    enabled: true
